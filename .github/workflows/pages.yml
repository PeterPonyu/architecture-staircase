name: Pages sketch (deploy gated)

# Sketch only. Deploy is gated (if: false). Do not enable GitHub Pages.
on:
  push:
    paths:
      - "portal/**"
      - "papers/FIGURE-INDEX.json"
      - "papers/figs/summaries/**"
      - "papers/figs/previews/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "portal/**"
      - "papers/FIGURE-INDEX.json"
      - "papers/figs/summaries/**"
      - "papers/figs/previews/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-sketch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and copy portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install validators
        run: python -m pip install --upgrade pip && pip install -r requirements-ci.txt
      - name: Build _site (no LaTeX)
        run: bash portal/build.sh

  deploy:
    name: Deploy to GitHub Pages
    if: false
    environment:
      name: github-pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages (gated)
        id: deployment
        run: echo "Pages deploy is disabled until an explicit enable."
