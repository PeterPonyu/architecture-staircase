name: Pages sketch (deploy gated)

on:
  push:
    paths:
      - "portal/**"
      - "papers/FIGURE-INDEX.json"
      - "papers/figs/summaries/**"
      - "papers/previews/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "portal/**"
      - "papers/FIGURE-INDEX.json"
      - "papers/figs/summaries/**"
      - "papers/previews/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-sketch
  cancel-in-progress: true

jobs:
  build:
    name: Validate and copy portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: python -m pip install --upgrade pip && pip install -r requirements-ci.txt
      - name: Build _site (no LaTeX)
        run: bash portal/build.sh

  deploy:
    name: Deploy to GitHub Pages
    if: false
    environment:
      name: github-pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
